{% extends "base.html" %}
{% block content %}

<style>
  body {
    background: linear-gradient(135deg, #f4f7fb 0%, #e8eef8 100%);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* Login Card */
  .login-wrapper {
    max-width: 450px;
    margin: 90px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 35px;
    border-top: 5px solid #00695F;
    box-shadow: 0 10px 30px rgba(0, 58, 143, 0.12);
    transition: all 0.3s ease;
  }

  .login-wrapper:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(0, 58, 143, 0.18);
  }

  /* Title */
  .page-title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #00695F; /* Colt Blue */
    margin-bottom: 25px;
  }

  /* Username inline with same Colt color */
  .page-title .userid {
    color: #00695F;
    font-weight: 700;
  }

  /* Labels */
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #333333;
    margin-bottom: 6px;
  }

  /* Input Fields */
  .form-control {
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    border: 1px solid #d6dce5;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 18px;
    transition: all 0.25s ease;
    box-sizing: border-box;
  }

  .form-control:hover {
    border-color: #00695F;
  }

  .form-control:focus {
    outline: none;
    border-color: #00695F;
    box-shadow: 0 0 0 3px rgba(0, 58, 143, 0.15);
  }

  /* Colt Theme Button */
  .btn-login {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #00695F;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-login:hover {
    background: #00695F;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 58, 143, 0.3);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  @media (max-width: 500px) {
    .login-wrapper {
      margin: 40px 15px;
      padding: 25px;
    }

    .page-title {
      font-size: 20px;
      line-height: 1.4;
    }
  }
</style>

<div class="login-wrapper">

  <div class="page-title">
    Reset Password for
    <span class="userid">{{ userid }}</span>
  </div>

  <form method="post">
    {% csrf_token %}

    <label class="form-label">New Password</label>
    <input
      type="password"
      name="password"
      class="form-control"
      placeholder="Enter new password"
      required
    >

    <label class="form-label">Confirm Password</label>
    <input
      type="password"
      name="confirm_password"
      class="form-control"
      placeholder="Confirm new password"
      required
    >

    <button type="submit" class="btn-login">
      Update Password
    </button>
  </form>

</div>

{% endblock %}
