
<!doctype html>
<html>
{% load static %}
<head>
  <meta charset="utf-8">
  <title>Compensa</title>

  {% static 'css/bootstrap.min.css' %}
  <script src="{% static 'js/bootstraps' %}>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
</head>

<body>

<!-- ✅ CLEAN LIGHT NAVBAR -->
<nav class="navbar navbar-expand-lg light-navbar">
  <div class="container-fluid px-3">

    <!-- LEFT SIDE (Optional empty for clean look) -->
    <div></div>

    <!-- RIGHT SIDE BUTTONS -->
    <div class="ms-auto d-flex gap-2">

      {% if user.is_authenticated %}

        <a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard' %}">
          Dashboard
        </a>
        <!-- ✅ Logout -->
        <form method="POST" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-danger">
            Logout
          </button>
        </form>
      {% endif %}

    </div>

  </div>
</nav>

<!-- ✅ MAIN CONTENT -->
<div class="container-fluid px-4 py-3 main-content">

{% for message in messages %}
  <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-dismiss" role="alert">
    {{ message }}
    
    <!-- ✅ Close button -->
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
{% endfor %}

  {% block content %}{% endblock %}

<script>
  // ✅ Auto close alerts after 10 seconds
  setTimeout(function() {
    const alerts = document.querySelectorAll('.alert.auto-dismiss');
    
    alerts.forEach(function(alert) {
      let bsAlert = new bootstrap.Alert(alert);
      bsAlert.close();
    });
  }, 5000); // 10 sec
</script>


</div>

<!-- ✅ FOOTER -->
<footer class="custom-footer">
  Developed by Global Build Center
</footer>

<!-- ✅ CUSTOM STYLES -->
<style>
  
.alert {
  transition: opacity 0.5s ease-out;
}

  /* Navbar (Colt light style) */
  .light-navbar {
    background: linear-gradient(90deg, #E6F0FF, #F4F6FF);
    border-bottom: 1px solid #dcdcdc;
  }

  /* Buttons */
  .btn-outline-primary {
    border-color: #003A8F;
    color: #003A8F;
  }

  .btn-outline-primary:hover {
    background-color: #003A8F;
    color: #fff;
  }

  .btn-outline-secondary:hover {
    background-color: #6c757d;
    color: #fff;
  }

  .btn-outline-danger:hover {
    background-color: #dc3545;
    color: #fff;
  }

  /* Content spacing */
  .main-content {
    min-height: 85vh;
  }

  /* ✅ Footer bottom-right */
  .custom-footer {
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #6c757d;
  }

</style>

</body>
</html>
